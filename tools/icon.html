<meta charset="utf-8">
<style>
  /* App-icon artwork: the case and dial only — the top buttons become noise
     below about 32px, so they are left out. */
  :root {
    --body: #EDE4D8;
    --sector: #2F6B4F;
    --knob: #C9A227;
    --face: color-mix(in srgb, var(--body) 13%, #ffffff);
    --bezel: color-mix(in srgb, var(--body) 86%, #000000);
    --ink: color-mix(in srgb, var(--sector) 26%, #4a4a4a);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 1024px; background: transparent; overflow: hidden; }

  .case {
    position: absolute;
    left: 92px; top: 112px;
    width: 840px; height: 840px;
    border-radius: 188px;
    background: linear-gradient(150deg,
      color-mix(in srgb, var(--body) 86%, #fff) 0%,
      var(--body) 44%,
      color-mix(in srgb, var(--body) 88%, #000) 100%);
    box-shadow: 0 26px 46px rgba(0,0,0,.24), 0 4px 10px rgba(0,0,0,.14);
  }
  .case::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: linear-gradient(155deg, rgba(255,255,255,.44), rgba(255,255,255,0) 46%);
  }
  .dial { position: absolute; inset: 7%; }
  svg { width: 100%; height: 100%; display: block; }
  .bezel { fill: var(--bezel); }
  .face { fill: var(--face); }
  .sector { fill: var(--sector); }
  .hand { stroke: color-mix(in srgb, var(--sector) 78%, #000); stroke-width: 1.6; stroke-linecap: round; }
  .hub-ring { fill: color-mix(in srgb, var(--knob) 70%, #000); opacity: .18; }
  .hub { fill: var(--knob); }
  .tick { stroke: var(--ink); }
  .tick.major { stroke-width: 1.1; opacity: .78; }
  .tick.minor { stroke-width: .5; opacity: .34; }
</style>

<div class="case">
  <div class="dial">
    <svg viewBox="0 0 100 100">
      <circle class="bezel" cx="50" cy="50" r="48.5"/>
      <circle class="face" cx="50" cy="50" r="46"/>
      <g class="ticks"></g>
      <path class="sector" d=""/>
      <line class="hand" x1="50" y1="50" x2="50" y2="22"/>
      <circle class="hub-ring" cx="50" cy="50" r="8.5"/>
      <circle class="hub" cx="50" cy="50" r="7"/>
    </svg>
  </div>
</div>

<script src="../renderer/dial.js"></script>
<script>
  Dial.buildTicks(document.querySelector('.ticks'))
  const MINUTES = 25
  document.querySelector('.sector').setAttribute('d', Dial.sectorPath(MINUTES))
  const [hx, hy] = Dial.polar(MINUTES * 6, Dial.R_SECTOR)
  const hand = document.querySelector('.hand')
  hand.setAttribute('x2', hx.toFixed(2))
  hand.setAttribute('y2', hy.toFixed(2))
</script>
