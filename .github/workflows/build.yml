name: build

# Builds on every push to main so a current installer is always downloadable
# from the run's artifacts, and on a version tag so a release can be filled.
# Can also be started by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    name: syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # A typo should fail in seconds rather than after a ten-minute package step.
      - name: Parse every script
        run: |
          for f in main.js preload.js renderer/*.js tools/*.js; do
            node --check "$f" || exit 1
          done
      - name: Every language covers every key
        run: |
          node -e '
            const { LANGS, STRINGS } = require("./renderer/i18n.js")
            const base = Object.keys(STRINGS["zh-Hant"])
            let bad = false
            for (const l of LANGS) {
              const missing = base.filter(k => !(k in STRINGS[l.id]))
              if (missing.length) { console.error(l.id, "missing:", missing.join(", ")); bad = true }
            }
            if (bad) process.exit(1)
            console.log(LANGS.length + " languages, " + base.length + " keys, complete")
          '

  build:
    name: ${{ matrix.label }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            flag: --mac
            glob: dist/*.dmg
          - os: windows-latest
            label: Windows
            flag: --win
            glob: dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Package
        # --publish never matters: electron-builder sees CI and otherwise tries to
        # publish to Releases on its own, which fails without a token even though
        # the installers built fine. Publishing is the attach job's business, and
        # only for tags.
        run: npx electron-builder ${{ matrix.flag }} --publish never
        env:
          # unsigned builds: do not go looking for a signing identity
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: sweep-${{ matrix.label }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  attach:
    name: attach to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # A draft, never a published release: the notes are written by hand, and
      # nothing should go public because a tag was pushed.
      - name: Attach the installers to this tag's release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/*/* --clobber --repo "$GITHUB_REPOSITORY"
            echo "Uploaded to the existing $GITHUB_REF_NAME release."
          else
            gh release create "$GITHUB_REF_NAME" artifacts/*/* \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --notes "Draft. Write the notes, then publish."
            echo "Created a draft release for $GITHUB_REF_NAME with the installers attached."
          fi
